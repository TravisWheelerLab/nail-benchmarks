# Where long-seqs reads and writes. Paths only, relative to this file.
#
# Its set is pairs rather than a cross, built by `build-set --in
# long-seqs-real` out of the six pairs checked in under data/long-seqs/.
# Six pairs is too small to have a toy.

[real]
set      = "../../sets/long-seqs/inputs"
run      = "../../sets/long-seqs/outputs"
analysis = "../../sets/long-seqs/analysis"
tmp      = "../../sets/long-seqs/tmp"
