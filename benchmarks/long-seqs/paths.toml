# Where long-seqs reads and writes. Paths only, relative to this file.
#
# Its sets are pairs rather than a cross, built by `build-set --in
# long-seqs-toy|long-seqs-real` out of the sequences checked in under
# data/long-seqs/.

[toy]
set      = "../../store/long-seqs-toy/inputs"
run      = "../../store/long-seqs-toy/outputs"
analysis = "../../store/long-seqs-toy/analysis"
tmp      = "../../store/long-seqs-toy/tmp"

[real]
set      = "../../store/long-seqs-real/inputs"
run      = "../../store/long-seqs-real/outputs"
analysis = "../../store/long-seqs-real/analysis"
tmp      = "../../store/long-seqs-real/tmp"
