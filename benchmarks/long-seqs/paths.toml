# Where long-seqs reads and writes. Paths only, relative to this file.
#
# Its sets are pairs rather than a cross, built by `build-set --in
# long-seqs-toy|long-seqs-real` out of the sequences checked in under
# data/long-seqs/.

[toy]
set      = "../../store/sets/long-seqs-toy/inputs"
run      = "../../store/sets/long-seqs-toy/outputs/long-seqs"
analysis = "../../store/sets/long-seqs-toy/analysis/long-seqs"
tmp      = "../../store/sets/long-seqs-toy/tmp/long-seqs"

[real]
set      = "../../store/sets/long-seqs-real/inputs"
run      = "../../store/sets/long-seqs-real/outputs/long-seqs"
analysis = "../../store/sets/long-seqs-real/analysis/long-seqs"
tmp      = "../../store/sets/long-seqs-real/tmp/long-seqs"
