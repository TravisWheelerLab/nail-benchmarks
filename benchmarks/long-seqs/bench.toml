# Long-sequence benchmark: six very large protein pairs (titin, EBH, HMCN1,
# coronavirus R1AB, ...) used to measure how much of the dynamic programming
# matrix nail actually computes at extreme sequence lengths.
#
#   long-seqs run
#   long-seqs parse cells
#
# Queries and targets are paired, not crossed: query/1.query.fa is searched
# against target/1.target.fa and nothing else. The inputs are checked into git,
# so there is no build step.

[defaults]
threads = 24

[[run]]
tool = "nail"
query = "seq"
name = "nail.{query}"
# f32-p widens the sparse band enough that these pairs align at all
args = "--allow-overwrite --f32-p 5"
