# Where hit-loss reads and writes. Paths only, relative to this file.
#
# Its own two sets: sharing one with another benchmark would hide what this one
# actually reads. A set and everything derived from it share a directory.

[toy]
set      = "../../store/hit-loss-toy/inputs"
run      = "../../store/hit-loss-toy/outputs/hit-loss"
analysis = "../../store/hit-loss-toy/analysis/hit-loss"
tmp      = "../../store/hit-loss-toy/tmp/hit-loss"

[real]
set      = "../../store/hit-loss-real/inputs"
run      = "../../store/hit-loss-real/outputs/hit-loss"
analysis = "../../store/hit-loss-real/analysis/hit-loss"
tmp      = "../../store/hit-loss-real/tmp/hit-loss"
