# Where hit-loss reads and writes. Paths only, relative to this file.
#
# A set and everything derived from it share a directory, so a run against the
# toy set sits beside the toy set rather than in a tree of its own.

[toy]
set      = "../../store/sets/toy/inputs"
run      = "../../store/sets/toy/outputs/hit-loss"
analysis = "../../store/sets/toy/analysis/hit-loss"
tmp      = "../../store/sets/toy/tmp/hit-loss"

[full]
set      = "../../store/sets/mgy-fixed/inputs"
run      = "../../store/sets/mgy-fixed/outputs/hit-loss"
analysis = "../../store/sets/mgy-fixed/analysis/hit-loss"
tmp      = "../../store/sets/mgy-fixed/tmp/hit-loss"
