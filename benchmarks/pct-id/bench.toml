# Percent-identity benchmark: profmark-style ROC over Pfam families embedded in
# a Swissprot decoy background.
#
#   pct-id build --size toy --pairs 50    assemble benchmark-toy/
#   pct-id run   --size toy               execute every run below against it
#
# `query` selects a tool's profile ("prf") or sequence ("seq") mode; each tool
# maps that onto its own inputs and binaries.

[defaults]
threads = 24
evalue = "1e9"

# ---------------------------------------------------------------- nail

[[run]]
tool = "nail"
query = ["prf", "seq"]
s = [5.7, 7.5, 10.0, 12.0, 14.0]
max_seqs = [2000]
name = "nail-s{s}-ms{max_seqs}.{query}"
args = "--allow-overwrite --mmseqs-s {s} --mmseqs-max-seqs {max_seqs} -E {evalue}"

# --------------------------------------------------------------- hmmer

# hmmsearch/phmmer scale poorly past a couple of threads, so the query set is
# split threads/threads_per ways and run concurrently.
[[run]]
tool = "hmmer"
query = ["prf", "seq"]
threads_per = 2
name = "hmmer.{query}"
args = "-E {evalue}"

# -------------------------------------------------------------- mmseqs

[[run]]
tool = "mmseqs"
query = ["prf", "seq"]
s = [5.7, 7.5, 10.0, 12.0, 14.0]
max_seqs = [2000]
name = "mmseqs-s{s}-ms{max_seqs}.{query}"
args = "-s {s} --max-seqs {max_seqs} -e 1e3"

# --------------------------------------------------------------- blast

# NOTE: blast is left at its default E-value. Raising it to 1e9 the way the
# other tools are makes it dramatically slower for no extra recall.
[[run]]
tool = "blast"
query = ["prf", "seq"]
name = "blast.{query}"

# ---------------------------------------------------------------- last

[[run]]
tool = "last"
query = "seq"
name = "last.{query}"
args = "-E {evalue}"

# ------------------------------------------------------------- diamond

# diamond's sensitivity presets are mutually exclusive flags rather than a
# swept value, so they are separate blocks.
[[run]]
tool = "diamond"
query = "seq"
preset = "default"
name = "diamond-{preset}.{query}"
args = "--evalue {evalue}"

[[run]]
tool = "diamond"
query = "seq"
preset = "ultra-sensitive"
name = "diamond-{preset}.{query}"
args = "--ultra-sensitive --evalue {evalue}"
