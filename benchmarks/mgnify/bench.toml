# MGnify/Pfam benchmark: the full Pfam profile set against metagenomic
# proteins, sharded so work can be split across NUMA nodes.
#
#   mgnify build                          shard all of MGnify against all of Pfam
#   mgnify run --shards 1-500 --numa-node 0
#   mgnify run --shards 501-1000 --numa-node 1
#
# Only profile searches make sense here: the query set is Pfam, and there is no
# unaligned query fasta.

[defaults]
threads = 24
evalue = "10"

# ---------------------------------------------------------------- nail

[[run]]
tool = "nail"
query = "prf"
s = [9.0, 10.0, 12.0]
name = "nail-s{s}-prog.{query}"
args = "--allow-overwrite --mmseqs-s {s} --seed-mode prog -E {evalue}"

# -------------------------------------------------------------- mmseqs

[[run]]
tool = "mmseqs"
query = "prf"
s = [7.5, 12.0]
max_seqs = 2000
name = "mmseqs-s{s}-ms{max_seqs}.{query}"
args = "-s {s} --max-seqs {max_seqs} -e {evalue}"

# --------------------------------------------------------------- hmmer

# hmmsearch scales poorly past a couple of threads, so the query set is split
# threads/threads_per ways and run concurrently.
[[run]]
tool = "hmmer"
query = "prf"
threads_per = 2
name = "hmmer.{query}"
args = "-E {evalue}"
