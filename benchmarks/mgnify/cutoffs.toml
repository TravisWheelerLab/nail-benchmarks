# Calibration of per-family false-positive score cutoffs.
#
#   mgnify cutoffs all -n 100        every stage, over 100 shards
#
# or one stage at a time:
#
#   mgnify cutoffs reverse -n 100    mgy/ -> cutoffs/mgy-rev/
#   mgnify cutoffs recruit           find sequences that score when reversed
#   mgnify cutoffs decoys            un-reverse them, group per family
#   mgnify cutoffs search -j 24      each family against its own decoys
#   mgnify cutoffs learn             -> cutoffs/cutoffs.txt
#
# Two stages, two parameterizations. Recruitment is a cheap sweep of the whole
# query set against whole shards; the decoy pass is exhaustive but tiny,
# because each family only sees the sequences that recruitment found for it.

[defaults]
threads = 24
evalue = "10"

# ------------------------------------------------------------- recruit
#
# Deliberately not the same settings as bench.toml: this pass only has to
# nominate candidates, and anything it misses at s=11.0 would not have
# survived the E-value filter downstream either.

[[recruit]]
tool = "nail"
query = "prf"
s = 11.0
max_seqs = 5000
name = "nail-s{s}-ms{max_seqs}.{query}"
args = "--allow-overwrite --mmseqs-s {s} --mmseqs-max-seqs {max_seqs} -E {evalue}"

[[recruit]]
tool = "mmseqs"
query = "prf"
s = 11.0
max_seqs = 5000
name = "mmseqs-s{s}-ms{max_seqs}.{query}"
args = "-s {s} --max-seqs {max_seqs} -e {evalue}"

# --------------------------------------------------------------- decoy
#
# One thread per search, with the parallelism on the outside: there are two
# searches per recruited family and each is small. The prefilter is opened all
# the way up so a decoy's score is its real score rather than one truncated by
# recruitment's settings, which is the whole reason this second pass exists.

[[decoy]]
tool = "nail"
query = "prf"
threads = 1
s = 12.0
max_seqs = 1000000000
name = "nail.{query}"
args = "--allow-overwrite --mmseqs-s {s} --mmseqs-max-seqs {max_seqs} -E {evalue}"

[[decoy]]
tool = "mmseqs"
query = "prf"
threads = 1
s = 12.0
max_seqs = 1000000000
name = "mmseqs.{query}"
args = "-s {s} --max-seqs {max_seqs} -e {evalue}"

# hmmer is here to be compared against nail, which approximates its model.
# Nothing downstream of cutoffs.txt reads the hmmer column.
[[decoy]]
tool = "hmmer"
query = "prf"
threads = 1
name = "hmmer.{query}"
args = "-E {evalue}"
