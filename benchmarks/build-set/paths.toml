# What build-set can make, and out of what.
#
# A table describes a dataset: where it comes from, how much of it, and where
# it goes. Nothing about a search belongs here -- no tools, no flags, no
# sensitivities, no threads. Paths are relative to this file.
#
# Every benchmark gets its own two sets. Sharing one would hide what a
# benchmark actually reads: cloud-search and loss-decomp search a single unit, and
# for a long time they did that by opening shard 1 of recall's thousand.
#
# A set and everything derived from it share a directory, so `out` is the
# `inputs/` of one and a run against it writes its siblings.

# ------------------------------------------------------------------- recall

# Every shard, swept. The only benchmark here that reads a whole collection.
[recall-toy]
shape      = "fixed"
queries    = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"
targets    = "../../data/mgnify"
out        = "../../sets-toy/recall/inputs"
shards     = 2
seqs       = 400
fams       = 5

[recall-real]
shape      = "fixed"
queries    = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"
targets    = "../../data/mgnify"
out        = "../../sets/recall/inputs"
shards     = 1000

# ------------------------------------------------- cloud-search and loss-decomp

# One unit each, so one shard is the whole set. A round million rather than one
# of recall-real's thousand, which was 2,455,939: both of these sweep their unit
# many times over -- 162 cells for cloud-search, 12 seeding arms for
# loss-decomp -- and the size that makes a sweep affordable is worth more here
# than a cost that reads directly against a recall column.
[cloud-search-toy]
shape = "cross"
out   = "../../sets-toy/cloud-search/inputs"

[[cloud-search-toy.queries]]
name       = "pfam"
hmm        = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"
fams       = 400

[[cloud-search-toy.targets]]
name = "mgnify"
from = "../../data/mgnify"
seqs = 50000

[[cloud-search-toy.targets]]
name = "swissprot"
from = "../../data/swissprot.fa"
seqs = 50000

# 500,000 a side rather than the million loss-decomp draws: Swissprot holds
# 570,420 sequences in total, and a target the size of most of its source is a
# sample of nothing. The two units have to be the same size for the surfaces to
# be read against each other, so the smaller source sets it.
[cloud-search-real]
shape = "cross"
out   = "../../sets/cloud-search/inputs"

[[cloud-search-real.queries]]
name       = "pfam"
hmm        = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"

[[cloud-search-real.targets]]
name = "mgnify"
from = "../../data/mgnify"
seqs = 500000

[[cloud-search-real.targets]]
name = "swissprot"
from = "../../data/swissprot.fa"
seqs = 500000

[loss-decomp-toy]
shape = "cross"
out   = "../../sets-toy/loss-decomp/inputs"

[[loss-decomp-toy.queries]]
name       = "pfam"
hmm        = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"
fams       = 400

[[loss-decomp-toy.targets]]
name = "mgnify"
from = "../../data/mgnify"
seqs = 50000

[[loss-decomp-toy.targets]]
name = "swissprot"
from = "../../data/swissprot.fa"
seqs = 50000

# Where nail loses hmmer's hits is a question about the sequences being
# searched, so it gets the same two kinds of target cloud-search does, at the
# same size, and the two benchmarks' answers can be read side by side.
[loss-decomp-real]
shape = "cross"
out   = "../../sets/loss-decomp/inputs"

[[loss-decomp-real.queries]]
name       = "pfam"
hmm        = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"

[[loss-decomp-real.targets]]
name = "mgnify"
from = "../../data/mgnify"
seqs = 500000

[[loss-decomp-real.targets]]
name = "swissprot"
from = "../../data/swissprot.fa"
seqs = 500000

# ----------------------------------------------------------- thread-scaling

# One unit, all of Pfam against 500,000 MGnify sequences. At 1,000 families
# nail ran 17.6 s at 48 threads, about 9 s of it serial, so the curve measured
# that floor. One-core hmmsearch did 0.0109 s per family per million residues
# against Swissprot, which puts its one-core point here at about 6 hours a rep.
[thread-scaling-toy]
shape = "cross"
out   = "../../sets-toy/thread-scaling/inputs"

[[thread-scaling-toy.queries]]
name       = "pfam"
hmm        = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"
fams       = 50

[[thread-scaling-toy.targets]]
name = "mgnify"
from = "../../data/mgnify"
seqs = 20000

[thread-scaling-real]
shape = "cross"
out   = "../../sets/thread-scaling/inputs"

[[thread-scaling-real.queries]]
name       = "pfam"
hmm        = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"

[[thread-scaling-real.targets]]
name = "mgnify"
from = "../../data/mgnify"
seqs = 500000

# -------------------------------------------------------------- stage-times

# One set of two parts, each its own recipe, searched once each so the
# relative cost of nail's stages can be read across two kinds of input. The
# pid parts draw from the same split, with the same parameters, as pid's own.
[stage-times-toy]
shape = "union"
out   = "../../sets-toy/stage-times/inputs"
parts = [
  { name = "mgy", label = "stage-times-mgy-toy" },
  { name = "pid", label = "stage-times-pid-toy" },
]

[stage-times-real]
shape = "union"
out   = "../../sets/stage-times/inputs"
parts = [
  { name = "mgy", label = "stage-times-mgy" },
  { name = "pid", label = "stage-times-pid" },
]

# the parts; a union builds each under its own directory whatever `out` says
[stage-times-mgy-toy]
shape = "cross"
out   = "../../sets-toy/stage-times/inputs/mgy"

[[stage-times-mgy-toy.queries]]
name       = "pfam"
hmm        = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"
fams       = 50

[[stage-times-mgy-toy.targets]]
name = "mgnify"
from = "../../data/mgnify"
seqs = 20000

[stage-times-mgy]
shape = "cross"
out   = "../../sets/stage-times/inputs/mgy"

[[stage-times-mgy.queries]]
name       = "pfam"
hmm        = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"

# one real recall shard, a thousandth of MGnify
[[stage-times-mgy.targets]]
name = "mgnify"
from = "../../data/mgnify"
seqs = 2455940

[stage-times-pid-toy]
shape      = "profmark"
alignments = "../../data/pfam.sto"
decoys     = "../../data/trembl.fa"
split      = "../pid/profmark"
out        = "../../sets-toy/stage-times/inputs/pid"
pairs      = 200

[stage-times-pid]
shape      = "profmark"
alignments = "../../data/pfam.sto"
decoys     = "../../data/trembl.fa"
split      = "../pid/profmark"
out        = "../../sets/stage-times/inputs/pid"

# ------------------------------------------------------------------ cutoffs

# The same deal recall gets, written backwards. Reversing keeps a sequence's
# composition and destroys its homology, so a family that still scores against
# one is scoring noise, which is what a threshold is learned from. The tag is
# on the recipe rather than a stage, so the set arrives reversed and nothing
# makes a second copy of it.
[cutoffs-toy]
shape      = "fixed"
queries    = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"
targets    = "../../data/mgnify"
out        = "../../sets-toy/cutoffs/inputs"
shards     = 2
seqs       = 400
fams       = 5
reversed   = true

[cutoffs-real]
shape      = "fixed"
queries    = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"
targets    = "../../data/mgnify"
out        = "../../sets/cutoffs/inputs"
shards     = 1000
reversed   = true


# ---------------------------------------------------------------- long-seqs

# Pairs rather than a cross: one query against one target, and the two sources
# are separate directories so a sequence is never on both sides. These are
# pairs somebody chose for their length, so nothing is drawn -- the recipe
# selects and places them.
[long-seqs-toy]
shape   = "pairs"
queries = "../../data/long-seqs/query"
targets = "../../data/long-seqs/target"
out     = "../../sets-toy/long-seqs/inputs"
pairs   = 2

[long-seqs-real]
shape   = "pairs"
queries = "../../data/long-seqs/query"
targets = "../../data/long-seqs/target"
out     = "../../sets/long-seqs/inputs"

# ---------------------------------------------------------------------- pid

# Recall against percent identity. The split is drawn once from Pfam's SEED and
# shared by both labels: it depends only on the alignments and the split
# parameters, and it is the expensive half. The true targets are hidden among
# reversed TrEMBL sequences, originals.fa holds those sequences unreversed, and
# truth.tbl records which pair is which.
[pid-toy]
shape      = "profmark"
alignments = "../../data/pfam.sto"
decoys     = "../../data/trembl.fa"
split      = "../pid/profmark"
out        = "../../sets-toy/pid/inputs"
pairs      = 200

[pid-real]
shape      = "profmark"
alignments = "../../data/pfam.sto"
decoys     = "../../data/trembl.fa"
split      = "../pid/profmark"
out        = "../../sets/pid/inputs"

# ------------------------------------------------------ cutoffs, on swissprot

# The same reversal-recruit calibration the MGnify cutoffs run, against a
# Swissprot background instead. Four sizes, because the question is how much
# the learned cutoffs move as the decoy pool grows, and whether they settle.
# One shard each: the pool is the variable, not the sharding.
[cutoffs-sp-10k]
shape      = "fixed"
queries    = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"
targets    = "../../data/swissprot.fa"
out        = "../../sets/cutoffs-sp-10k/inputs"
shards     = 1
seqs       = 10000
reversed   = true

[cutoffs-sp-100k]
shape      = "fixed"
queries    = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"
targets    = "../../data/swissprot.fa"
out        = "../../sets/cutoffs-sp-100k/inputs"
shards     = 1
seqs       = 100000
reversed   = true

[cutoffs-sp-250k]
shape      = "fixed"
queries    = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"
targets    = "../../data/swissprot.fa"
out        = "../../sets/cutoffs-sp-250k/inputs"
shards     = 1
seqs       = 250000
reversed   = true

[cutoffs-sp-all]
shape      = "fixed"
queries    = "../../data/pfam.hmm"
alignments = "../../data/pfam.sto"
targets    = "../../data/swissprot.fa"
out        = "../../sets/cutoffs-sp-all/inputs"
shards     = 1
reversed   = true
