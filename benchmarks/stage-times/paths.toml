# Where stage-times reads and writes. Paths only, relative to this file.
#
# Its set is a union of two parts, built by `build-set --in
# stage-times-toy|stage-times-real`: `mgy` is a cross of Pfam against MGnify,
# `pid` is the profmark set pid searches.

[toy]
set      = "../../sets-toy/stage-times/inputs"
run      = "../../sets-toy/stage-times/outputs"
analysis = "../../sets-toy/stage-times/analysis"
tmp      = "../../sets-toy/stage-times/tmp"

[real]
set      = "../../sets/stage-times/inputs"
run      = "../../sets/stage-times/outputs"
analysis = "../../sets/stage-times/analysis"
tmp      = "../../sets/stage-times/tmp"
