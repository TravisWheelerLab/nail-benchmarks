# Where cutoffs reads and writes. Paths only, relative to this file.
#
# It reads one set and everything it makes goes under that set's outputs. The
# decoys are an intermediate -- stage 2 writes them, stage 3 reads them -- not
# a set of their own: a set is what build-set produces from sources under a
# recipe, and these come out of whatever recruit happened to score.

[toy]
set      = "../../sets-toy/cutoffs/inputs"
recruit  = "../../sets-toy/cutoffs/outputs/recruit"
gather   = "../../sets-toy/cutoffs/outputs/gather"
reject   = "../../sets-toy/cutoffs/outputs/reject"
analysis = "../../sets-toy/cutoffs/analysis"
tmp      = "../../sets-toy/cutoffs/tmp"

[real]
set      = "../../sets/cutoffs/inputs"
recruit  = "../../sets/cutoffs/outputs/recruit"
gather   = "../../sets/cutoffs/outputs/gather"
reject   = "../../sets/cutoffs/outputs/reject"
analysis = "../../sets/cutoffs/analysis"
tmp      = "../../sets/cutoffs/tmp"

