# Where cutoffs reads and writes. Paths only, relative to this file.
#
# It reads one set and everything it makes goes under that set's outputs. The
# decoys are an intermediate -- stage 2 writes them, stage 3 reads them -- not
# a set of their own: a set is what build-set produces from sources under a
# recipe, and these come out of whatever recruit happened to score.

[toy]
set      = "../../store/cutoffs-toy/inputs"
recruit  = "../../store/cutoffs-toy/outputs/recruit"
gather   = "../../store/cutoffs-toy/outputs/gather"
reject   = "../../store/cutoffs-toy/outputs/reject"
analysis = "../../store/cutoffs-toy/analysis/cutoffs"
tmp      = "../../store/cutoffs-toy/tmp/cutoffs"

[real]
set      = "../../store/cutoffs-real/inputs"
recruit  = "../../store/cutoffs-real/outputs/recruit"
gather   = "../../store/cutoffs-real/outputs/gather"
reject   = "../../store/cutoffs-real/outputs/reject"
analysis = "../../store/cutoffs-real/analysis/cutoffs"
tmp      = "../../store/cutoffs-real/tmp/cutoffs"
