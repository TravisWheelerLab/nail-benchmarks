# Where cutoffs reads and writes. Paths only, relative to this file.
#
# It reads one set and builds another: `decoys` is a set in its own right, so
# it gets an `inputs/` like any other, and the searches over it are its runs.

[toy]
set      = "../../store/sets/cutoffs-toy/inputs"
decoys   = "../../store/sets/cutoffs-toy-decoys/inputs"
recruit  = "../../store/sets/cutoffs-toy/outputs/recruit"
search   = "../../store/sets/cutoffs-toy-decoys/outputs/search"
analysis = "../../store/sets/cutoffs-toy-decoys/analysis/cutoffs"
tmp      = "../../store/sets/cutoffs-toy-decoys/tmp/cutoffs"

[real]
set      = "../../store/sets/cutoffs-real/inputs"
decoys   = "../../store/sets/cutoffs-real-decoys/inputs"
recruit  = "../../store/sets/cutoffs-real/outputs/recruit"
search   = "../../store/sets/cutoffs-real-decoys/outputs/search"
analysis = "../../store/sets/cutoffs-real-decoys/analysis/cutoffs"
tmp      = "../../store/sets/cutoffs-real-decoys/tmp/cutoffs"
