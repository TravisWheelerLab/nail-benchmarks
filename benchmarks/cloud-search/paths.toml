# Where cloud-search reads and writes. Paths only, relative to this file.
#
# Its own two sets: sharing one with another benchmark would hide what this one
# actually reads. A set and everything derived from it share a directory.

[toy]
set      = "../../store/cloud-search-toy/inputs"
run      = "../../store/cloud-search-toy/outputs/cloud-search"
analysis = "../../store/cloud-search-toy/analysis/cloud-search"
tmp      = "../../store/cloud-search-toy/tmp/cloud-search"

[real]
set      = "../../store/cloud-search-real/inputs"
run      = "../../store/cloud-search-real/outputs/cloud-search"
analysis = "../../store/cloud-search-real/analysis/cloud-search"
tmp      = "../../store/cloud-search-real/tmp/cloud-search"
