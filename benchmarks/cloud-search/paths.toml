# Where cloud-search reads and writes. Paths only, relative to this file.
#
# Its own two sets: sharing one with another benchmark would hide what this one
# actually reads. A set and everything derived from it share a directory,
# except the figures: a pdf is read by a person, so every benchmark's go to
# figures/<set>/ at the root where they can be found together.

[toy]
set      = "../../sets-toy/cloud-search/inputs"
run      = "../../sets-toy/cloud-search/outputs"
analysis = "../../sets-toy/cloud-search/analysis"
figures  = "../../figures-toy"
tmp      = "../../sets-toy/cloud-search/tmp"

[real]
set      = "../../sets/cloud-search/inputs"
run      = "../../sets/cloud-search/outputs"
analysis = "../../sets/cloud-search/analysis"
figures  = "../../figures"
tmp      = "../../sets/cloud-search/tmp"
