# Where recall reads and writes. Paths only, relative to this file.
#
# Its own two sets: sharing one with another benchmark would hide what this one
# actually reads. A set and everything derived from it share a directory.

[toy]
set      = "../../store/sets/recall-toy/inputs"
run      = "../../store/sets/recall-toy/outputs/recall"
analysis = "../../store/sets/recall-toy/analysis/recall"
tmp      = "../../store/sets/recall-toy/tmp/recall"

[real]
set      = "../../store/sets/recall-real/inputs"
run      = "../../store/sets/recall-real/outputs/recall"
analysis = "../../store/sets/recall-real/analysis/recall"
tmp      = "../../store/sets/recall-real/tmp/recall"
