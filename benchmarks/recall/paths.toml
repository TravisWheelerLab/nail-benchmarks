# Where recall reads and writes. Paths only, relative to this file.
#
# Its own two sets: sharing one with another benchmark would hide what this one
# actually reads. A set and everything derived from it share a directory.

[toy]
set      = "../../sets-toy/recall/inputs"
run      = "../../sets-toy/recall/outputs"
analysis = "../../sets-toy/recall/analysis"
tmp      = "../../sets-toy/recall/tmp"

[real]
set      = "../../sets/recall/inputs"
run      = "../../sets/recall/outputs"
analysis = "../../sets/recall/analysis"
tmp      = "../../sets/recall/tmp"
