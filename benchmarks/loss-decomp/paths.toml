# Where loss-decomp reads and writes. Paths only, relative to this file.
#
# Its own two sets: sharing one with another benchmark would hide what this one
# actually reads. A set and everything derived from it share a directory.

[toy]
set      = "../../sets-toy/loss-decomp/inputs"
run      = "../../sets-toy/loss-decomp/outputs"
analysis = "../../sets-toy/loss-decomp/analysis"
figures  = "../../figures-toy"
tmp      = "../../sets-toy/loss-decomp/tmp"

[real]
set      = "../../sets/loss-decomp/inputs"
run      = "../../sets/loss-decomp/outputs"
analysis = "../../sets/loss-decomp/analysis"
figures  = "../../figures"
tmp      = "../../sets/loss-decomp/tmp"
