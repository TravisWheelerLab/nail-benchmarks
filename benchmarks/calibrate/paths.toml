# Where calibrate reads and writes. Paths only, relative to this file.
#
# Its own two sets: sharing one with another benchmark would hide what this one
# actually reads. A set and everything derived from it share a directory.

[toy]
set      = "../../store/calibrate-toy/inputs"
run      = "../../store/calibrate-toy/outputs/calibrate"
analysis = "../../store/calibrate-toy/analysis/calibrate"
tmp      = "../../store/calibrate-toy/tmp/calibrate"

[real]
set      = "../../store/calibrate-real/inputs"
run      = "../../store/calibrate-real/outputs/calibrate"
analysis = "../../store/calibrate-real/analysis/calibrate"
tmp      = "../../store/calibrate-real/tmp/calibrate"
