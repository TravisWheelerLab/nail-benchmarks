[workspace]
resolver = "2"

members = [
    "bioio",
    "run",
    "pct-id",
]

[workspace.dependencies]
bioio = { path = "bioio" }
run = { path = "run" }

anyhow = "1.0.99"
clap = { version = "4.5.53", features = ["derive"] }
glob = "0.3.3"
indexmap = { version = "2.13.0", features = ["serde"] }
libc = "0.2.189"
rand = "0.9.2"
rayon = "1.11.0"
regex = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
