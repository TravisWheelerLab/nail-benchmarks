[workspace]
resolver = "2"

members = [
    "crates/bench",
    "benchmarks/long-seqs",
    "benchmarks/mgy",
    "benchmarks/pid",
]

[workspace.dependencies]
bench = { path = "crates/bench" }

anyhow = "1.0.99"
clap = { version = "4.5.53", features = ["derive"] }
feisty = "0.1.0"
glob = "0.3.3"
indexmap = { version = "2.13.0", features = ["serde"] }
libsail = "0.1.0"
pail = "0.1.0"
rand = "0.10.2"
rayon = "1.11.0"
regex = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
thread_local = "1.1.9"
toml = "1.1.4"

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
